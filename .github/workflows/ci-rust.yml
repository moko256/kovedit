# Rust/Tauri checks. Fails the job on any non-zero exit.
# Hardened for untrusted PR code: pull_request (not pull_request_target),
# read-only permissions, no persisted checkout credentials, no secrets.
#
# Path filter covers src-tauri/** so it stays valid if the Tauri crate
# later moves under src-tauri/app (e.g. a Cargo workspace).

name: CI rust

on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'package.json'
      - '.github/workflows/ci-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-rust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: stable
          components: rustfmt
          rust-src-dir: src-tauri

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # Rust half of `pnpm format:check`
      # (rustfmt --check src-tauri/build.rs src-tauri/src/*.rs).
      - name: Format
        run: rustfmt --check src-tauri/build.rs src-tauri/src/*.rs

      # Same command as `pnpm test` in package.json.
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml
