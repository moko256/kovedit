# Rust/Tauri checks. Fails the job on any non-zero exit.
# Hardened for untrusted PR code: pull_request (not pull_request_target),
# read-only permissions, no persisted checkout credentials, no secrets.
#
# Path filter covers src-tauri/** (workspace root, app/, and lints/).

name: CI rust

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - "package.json"
      - ".github/workflows/ci-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-rust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: stable
          components: rustfmt
          rust-src-dir: src-tauri

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Dylint
        run: cargo install cargo-dylint dylint-link --locked

      # Rust half of `pnpm format:check`.
      - name: Format
        run: rustfmt --check src-tauri/app/build.rs src-tauri/app/src/*.rs src-tauri/lints/no_source_comments/src/*.rs

      # Rust half of `pnpm lint` / `pnpm lint:comments`.
      - name: Lint
        run: cargo dylint --all --manifest-path src-tauri/Cargo.toml -- --all-targets

      # Same command as `pnpm test` in package.json.
      - name: Test
        run: cargo test -p kovedit --manifest-path src-tauri/Cargo.toml
