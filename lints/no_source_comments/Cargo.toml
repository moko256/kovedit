[package]
name = "no_source_comments"
version = "0.1.0"
description = "Dylint library that denies Rust source comments"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "21baba9c10c5d179915cae82e6247bc2337872fb" }
dylint_linting = "6.4"

[dev-dependencies]
dylint_testing = "6.4"

[package.metadata.rust-analyzer]
rustc_private = true
